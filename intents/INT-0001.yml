title: GOVERN — Cultivate a culture of AI risk management
text: A culture of risk management is cultivated and present. The GOVERN function cultivates
  and implements a culture of risk management within organizations designing, developing, deploying,
  evaluating, or acquiring AI systems, and provides a structure by which AI risk management
  functions can align with organizational principles, policies, and strategic priorities.
