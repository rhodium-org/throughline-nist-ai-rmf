uid: SR-0037
type: system_requirement
status: approved
title: AI RMF MAP 5.2
text: Practices and personnel for supporting regular engagement with relevant AI actors and
  integrating feedback about positive, negative, and unanticipated impacts are in place and
  documented.
links:
- target: UR-0011
  type: implements
attrs:
  source_ref: MAP 5.2
rationale: AI systems are socio-technical in nature and can have positive, neutral, or negative
  implications that extend beyond their stated purpose. Negative impacts can be wide- ranging
  and affect individuals, groups, communities, organizations, and society, as well as the environment
  and national security.
