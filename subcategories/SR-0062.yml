uid: SR-0062
type: system_requirement
status: approved
title: AI RMF MANAGE 1.3
text: Responses to the AI risks deemed high priority, as identified by the map function, are
  developed, planned, and documented. Risk response options can include mitigating, transferring,
  avoiding, or accepting.
links:
- target: UR-0016
  type: implements
attrs:
  source_ref: MANAGE 1.3
rationale: Outcomes from GOVERN-1, MAP-5 and MEASURE-2, can be used to address and document
  identified risks based on established risk tolerances. Organizations can follow existing regulations
  and guidelines for risk criteria, tolerances and responses established by organizational,
  domain, discipline, sector, or professional requirements. In lieu of such guidance, organizations
  can develop risk response plans based on strategies such as accepted model risk management,
  enterprise risk management, and information sharing and disclosure practices.
