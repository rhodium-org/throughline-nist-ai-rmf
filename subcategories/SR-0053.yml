uid: SR-0053
type: system_requirement
status: proposed
title: AI RMF MEASURE 2.13
text: Effectiveness of the employed TEVV metrics and processes in the measure function
  are evaluated and documented.
rationale: The development of metrics is a process often considered to be objective
  but, as a human and organization driven endeavor, can reflect implicit and systemic
  biases, and may inadvertently reflect factors unrelated to the target function.
  Measurement approaches can be oversimplified, gamed, lack critical nuance, become
  used and relied upon in unexpected ways, fail to account for differences in affected
  groups and contexts.
normative: true
