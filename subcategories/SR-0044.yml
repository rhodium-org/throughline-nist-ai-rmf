uid: SR-0044
type: system_requirement
status: approved
title: AI RMF MEASURE 2.4
text: The functionality and behavior of the AI system and its components – as identified in
  the map function – are monitored when in production.
links:
- target: UR-0013
  type: implements
attrs:
  source_ref: MEASURE 2.4
rationale: AI systems may encounter new issues and risks while in production as the environment
  evolves over time. This effect, often referred to as “drift”, means AI systems no longer meet
  the assumptions and limitations of the original design. Regular monitoring allows AI Actors
  to monitor the functionality and behavior of the AI system and its components – as identified
  in the MAP function - and enhance the speed and efficacy of necessary system interventions.
