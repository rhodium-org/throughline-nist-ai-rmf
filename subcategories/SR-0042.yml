uid: SR-0042
type: system_requirement
status: proposed
title: AI RMF MEASURE 2.2
text: Evaluations involving human subjects meet applicable requirements (including
  human subject protection) and are representative of the relevant population.
rationale: Measurement and evaluation of AI systems often involves testing with human
  subjects or using data captured from human subjects. Protection of human subjects
  is required by law when carrying out federally funded research, and is a domain
  specific requirement for some disciplines. Standard human subjects protection procedures
  include protecting the welfare and interests of human subjects, designing evaluations
  to minimize risks to subjects, and completion of mandatory training regarding legal
  requirements and expectations.
normative: true
