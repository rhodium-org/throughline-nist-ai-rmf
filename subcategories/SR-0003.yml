uid: SR-0003
type: system_requirement
status: approved
title: AI RMF GOVERN 1.3
text: Processes, procedures, and practices are in place to determine the needed level of risk
  management activities based on the organization's risk tolerance.
links:
- target: UR-0001
  type: implements
attrs:
  source_ref: GOVERN 1.3
rationale: Risk management resources are finite in any organization. Adequate AI governance
  policies delineate the mapping, measurement, and prioritization of risks to allocate resources
  toward the most material issues for an AI system to ensure effective risk management. Policies
  may specify systematic processes for assigning mapped and measured risks to standardized risk
  scales.
