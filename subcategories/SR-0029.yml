title: AI RMF MAP 3.1
text: Potential benefits of intended AI system functionality and performance are
  examined and documented.
rationale: AI systems have enormous potential to improve quality of life, enhance
  economic prosperity and security costs. Organizations are encouraged to define
  and document system purpose and utility, and its potential positive impacts and
  benefits beyond current known performance benchmarks.
