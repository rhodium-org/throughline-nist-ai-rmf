uid: SR-0046
type: system_requirement
status: approved
title: AI RMF MEASURE 2.6
text: The AI system is evaluated regularly for safety risks – as identified in the map function.
  The AI system to be deployed is demonstrated to be safe, its residual negative risk does not
  exceed the risk tolerance, and it can fail safely, particularly if made to operate beyond
  its knowledge limits. Safety metrics reflect system reliability and robustness, real-time
  monitoring, and response times for AI system failures.
links:
- target: UR-0013
  type: implements
attrs:
  source_ref: MEASURE 2.6
rationale: Many AI systems are being introduced into settings such as transportation, manufacturing
  or security, where failures may give rise to various physical or environmental harms. AI systems
  that may endanger human life, health, property or the environment are tested thoroughly prior
  to deployment, and are regularly evaluated to confirm the system is safe during normal operations,
  and in settings beyond its proposed use and knowledge limits.
