uid: SR-0063
type: system_requirement
status: approved
title: AI RMF MANAGE 1.4
text: Negative residual risks (defined as the sum of all unmitigated risks) to both downstream
  acquirers of AI systems and end users are documented.
links:
- target: UR-0016
  type: implements
attrs:
  source_ref: MANAGE 1.4
rationale: Organizations may choose to accept or transfer some of the documented risks from
  MAP and MANAGE 1.3 and 2.1. Such risks, known as residual risk, may affect downstream AI actors
  such as those engaged in system procurement or use. Transparent monitoring and managing residual
  risks enables cost benefit analysis and the examination of potential values of AI systems
  versus its potential negative impacts.
