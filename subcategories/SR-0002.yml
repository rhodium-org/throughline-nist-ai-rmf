title: AI RMF GOVERN 1.2
text: The characteristics of trustworthy AI are integrated into organizational policies,
  processes, procedures, and practices.
rationale: Policies, processes, and procedures are central components of effective
  AI risk management and fundamental to individual and organizational accountability.
  All stakeholders benefit from policies, processes, and procedures which require
  preventing harm by design and default.
