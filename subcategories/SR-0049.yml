uid: SR-0049
type: system_requirement
status: proposed
title: AI RMF MEASURE 2.9
text: The AI model is explained, validated, and documented, and AI system output
  is interpreted within its context – as identified in the map function – to inform
  responsible use and governance.
rationale: Explainability and interpretability assist those operating or overseeing
  an AI system, as well as users of an AI system, to gain deeper insights into the
  functionality and trustworthiness of the system, including its outputs.
normative: true
