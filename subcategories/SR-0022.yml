uid: SR-0022
type: system_requirement
status: proposed
title: AI RMF MAP 1.3
text: The organization’s mission and relevant goals for AI technology are understood
  and documented.
rationale: Defining and documenting the specific business purpose of an AI system
  in a broader context of societal values helps teams to evaluate risks and increases
  the clarity of “go/no-go” decisions about whether to deploy.
normative: true
