uid: SR-0001
type: system_requirement
status: proposed
title: AI RMF GOVERN 1.1
text: Legal and regulatory requirements involving AI are understood, managed, and
  documented.
rationale: AI systems may be subject to specific applicable legal and regulatory
  requirements. Some legal requirements can mandate (e.g., nondiscrimination, data
  privacy and security controls) documentation, disclosure, and increased AI system
  transparency. These requirements are complex and may not be applicable or differ
  across applications and contexts.
normative: true
